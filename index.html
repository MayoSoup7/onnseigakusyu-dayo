<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>英語耳</title>
<link rel="manifest" href="manifest.webmanifest?v=12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
<header>
  <div class="brand">🎧 英語耳</div>
  <div class="headerBtns">
    <button id="themeBtn">☀️</button>
    <button id="bookBtn">📖 本を読む</button>
  </div>
</header>
<main>
  <section class="toolbar" id="editToolbar">
    <label>Lesson <select id="lessonSelect"></select></label>
    <button id="addPageBtn">＋ページ画像</button>
    <button id="addAudioBtn">＋音声</button>
    <button id="audioManagerBtn">🎵 音声管理</button>
    <button id="hideInfoBtn">🙈 非表示</button>
    <input id="pageFiles" type="file" accept="image/*" multiple hidden>
    <input id="audioFiles" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg" multiple hidden>
  </section>
  <section id="lessonTitle"></section>
  <section id="pages"></section>
  <section id="bookView" hidden></section>
  <section id="audioManager" hidden></section>
</main>

<aside id="player" class="player">
  <div class="now" id="now">音声を選択してください</div>
  <div class="seekrow"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="controls">
    <button id="prev">⏮</button><button id="restart">↺</button><button id="play">▶️</button><button id="next">⏭</button><button id="repeat">🔁</button>
  </div>
  <div class="controls small">
    <button id="setA">A</button><button id="setB">B</button><button id="ab">A-B OFF</button>
    <label>速度 <select id="speed"><option value="0.5">0.5</option><option value="0.75">0.75</option><option value="1" selected>1</option><option value="1.25">1.25</option><option value="1.5">1.5</option><option value="1.75">1.75</option><option value="2">2</option></select></label>
  </div>
  <div class="markers"><span id="markA">A:—</span><span id="markB">B:—</span></div>
</aside>

<dialog id="editDialog">
<form method="dialog">
<h3>Practice編集</h3>
<input id="practiceName" placeholder="Practice名">
<select id="audioSelect"></select>
<div class="dialogBtns"><button value="cancel">キャンセル</button><button id="savePractice" value="default">保存</button></div>
</form>
</dialog>

<dialog id="audioDialog">
<div class="audioDialogBox"><h3>🎵 Lesson音声管理</h3><div id="audioList"></div><button id="closeAudioDialog">閉じる</button></div>
</dialog>



<dialog id="recordDialog">
<div class="recordBox">
<h3>🎙️ シャドーイング</h3>
<p id="recordTarget"></p>
<div class="recordBtns"><button id="refOnly">お手本</button><button id="ownOnly">自分の声</button><button id="bothPlay">両方</button></div>
<button id="recordStart">⏺ 録音開始</button><button id="recordStop" disabled>⏹ 停止</button>
<p id="recordState">待機中</p>
<audio id="ownAudio" controls hidden></audio>
<button id="deleteRecording" hidden>録音を削除</button>
<button id="closeRecord">閉じる</button>
</div>
</dialog>
<script src="app.js?v=12"></script>
</body>
</html>
